name: Publish npm prerelease

on:
  workflow_dispatch:
    inputs:
      confirm_tag:
        description: Enter the selected js-v... tag exactly after the server smoke test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: proofstate-npm-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'JSOCIT-Inc/proofstate-js' && startsWith(github.ref, 'refs/tags/js-v') && inputs.confirm_tag == github.ref_name
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - run: node scripts/release-npm.mjs --pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proofstate-npm-tarballs
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec npm --version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: proofstate-npm-tarballs
          path: release-artifacts
      - name: Publish verified tarballs with npm trusted publishing
        run: pnpm exec node scripts/release-npm.mjs --publish-packed
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm_tag }}
